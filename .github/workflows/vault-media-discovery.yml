name: Vault Media Discovery Checks

on:
  push:
    branches:
      - "feat/media-first-discovery-*"
      - "feat/in-app-sheet-and-url-batch-import-*"
      - "fix/video-source-cover-preview-*"
      - "feat/deep-video-drilldown-*"
      - "feat/unrestricted-public-site-browsing-*"
      - "feat/google-login-drive-save-fallback-*"
      - "feat/in-vault-interactive-ai-studios-*"
      - "feat/unified-media-import-*"
      - "feat/elitebabes-browser-gallery-*"
      - "fix/discovery-nonhtml-fallback-*"
      - "feat/gallery-page-navigation-*"
      - "fix/gallery-image-403-viewer-*"
      - "feat/universal-browser-gallery-capture-*"
      - "feat/first-party-file-gallery-import-*"
      - "feat/vault-chrome-save-and-sheet-import-*"
      - "feat/in-app-sheet-and-url-batch-import-*"
      - "feat/extension-folder-picker-bulk-*"
  pull_request:
    branches:
      - "fix/relay-search-hardening-*"
      - "feat/media-first-discovery-*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit and regression tests
        run: npm test
      - name: Lint
        run: npx eslint app/capture/page.jsx components/ExtensionSavePicker.jsx
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Package Chrome extension for testing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vault-chrome-extension-v2.0
          path: extensions/vault-media-capture/
          if-no-files-found: error
          retention-days: 14
