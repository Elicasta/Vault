name: Vault Media Discovery Checks

on:
  push:
    branches:
      - "feat/media-first-discovery-*"
      - "fix/video-source-cover-preview-*"
      - "feat/deep-video-drilldown-*"
      - "feat/unrestricted-public-site-browsing-*"
      - "feat/google-login-drive-save-fallback-*"
      - "feat/drive-backup-oauth-*"
  pull_request:
    branches:
      - "fix/relay-search-hardening-*"
      - "feat/media-first-discovery-*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit and regression tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
